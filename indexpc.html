<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP Store</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #008080; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px; font-family: 'Microsoft Sans Serif', 'Segoe UI', Arial, sans-serif; }

    .nt-window { background: #c0c0c0; padding: 4px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; max-width: 560px; width: 100%; position: relative; height: 420px; display: flex; flex-direction: column; overflow: hidden; }
    .nt-titlebar { background: linear-gradient(90deg, #000080, #1084d0); padding: 4px 6px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .nt-titlebar .left { display: flex; align-items: center; gap: 6px; }
    .nt-titlebar .left .icon { font-weight: bold; color: #fff; font-size: 14px; background: rgba(255,255,255,0.1); padding: 0 4px; border-radius: 2px; }
    .nt-titlebar .left .title { font-weight: bold; color: #fff; font-size: 13px; }
    .nt-titlebar .right-search { display: flex; align-items: center; background: #ffffff; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; padding: 1px 2px 1px 6px; }
    .nt-titlebar .right-search input { border: none; background: transparent; padding: 3px 4px; font-size: 11px; font-family: 'Microsoft Sans Serif', Arial; color: #000; outline: none; width: 100px; }
    .nt-titlebar .right-search button { background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; padding: 2px 10px; font-size: 11px; font-family: 'Microsoft Sans Serif', Arial; cursor: pointer; color: #000; }

    .nt-menubar { background: linear-gradient(90deg, #BFC7C9, #7BADDE); padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #808080; height: 38px; position: relative; z-index: 10; flex-shrink: 0; }
    .nt-menubar .menu-left { display: flex; align-items: center; position: relative; }
    .nt-menubar .menu-left .dropdown-btn { padding: 3px 14px 3px 12px; font-size: 12px; color: #000; cursor: pointer; background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; display: flex; align-items: center; gap: 6px; height: 26px; font-family: 'Microsoft Sans Serif', Arial; }
    .nt-menubar .menu-left .dropdown-btn .arrow-down { font-size: 10px; transition: transform 0.15s; }
    .nt-menubar .menu-left .dropdown-btn .arrow-down.open { transform: rotate(180deg); }

    .dropdown-menu { display: none; position: absolute; top: calc(100% + 2px); left: 0; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; min-width: 100px; padding: 3px; z-index: 100; border: 1px solid #808080; }
    .dropdown-menu.open { display: block; }
    .dropdown-menu .dropdown-item { padding: 4px 16px; font-size: 12px; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; white-space: nowrap; background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; width: 100%; font-family: 'Microsoft Sans Serif', Arial; margin-bottom: 2px; text-align: center; }
    .dropdown-menu .dropdown-item:last-child { margin-bottom: 0; }
    .dropdown-menu .dropdown-item.active { background: #000080; color: #ffffff; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #4a6a9a, inset -2px -2px #808080, inset 2px 2px #2a4a7a; }

    .nt-menubar .gif-logo { display: flex; align-items: center; justify-content: flex-end; height: 100%; line-height: 0; flex-shrink: 0; }
    .nt-menubar .gif-logo img { display: block; height: 100%; width: auto; image-rendering: pixelated; object-fit: contain; }

    .nt-body { padding: 6px 4px 6px 8px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; display: flex; gap: 6px; align-items: stretch; flex-direction: row-reverse; flex: 1; min-height: 0; overflow: hidden; }

    .vscroll { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #c0c0c0; padding: 2px 3px; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; flex-shrink: 0; align-self: stretch; justify-content: center; user-select: none; opacity: 1; transition: opacity 0.2s; width: 20px; }
    .vscroll.disabled { opacity: 0.4; pointer-events: none; }
    .vscroll .v-arrow { width: 16px; height: 16px; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; display: flex; align-items: center; justify-content: center; font-size: 8px; cursor: pointer; color: #000; flex-shrink: 0; }
    .vscroll .v-arrow:active { box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }
    .vscroll .v-track { width: 16px; flex: 1; min-height: 40px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; position: relative; }
    .vscroll .v-track .v-thumb { position: absolute; left: 2px; width: 12px; height: 30px; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; top: 0; cursor: grab; }
    .vscroll .v-track .v-thumb:active { cursor: grabbing; }

    .nt-body .content-area { flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; scrollbar-width: none; -ms-overflow-style: none; }
    .nt-body .content-area::-webkit-scrollbar { display: none; width: 0; height: 0; }

    .app-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; gap: 12px; flex-wrap: wrap; flex-shrink: 0; min-height: 48px; }
    .app-row .app-name { font-size: 16px; font-weight: bold; color: #000; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .app-row .app-artist { font-size: 13px; color: #555; flex: 1; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-row .app-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .app-row .app-actions .nt-btn { padding: 4px 22px; background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; font-family: 'Microsoft Sans Serif', Arial; font-size: 12px; color: #000; cursor: pointer; font-weight: bold; }
    .app-row .app-actions .nt-btn:active { box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }

    .no-results { text-align: center; padding: 8px 16px; display: none; flex-shrink: 0; }
    .no-results.show { display: block; }
    .no-results img { display: block; margin: 0 auto; width: 80px; height: auto; image-rendering: pixelated; }

    .mini-player-window { position: fixed; top: 80px; left: 80px; width: 380px; background: #c0c0c0; padding: 4px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf, 0 8px 32px rgba(0,0,0,0.6); z-index: 99999; display: none; min-width: 280px; user-select: none; overflow: hidden; }
    .mini-player-window .mini-titlebar { background: linear-gradient(90deg, #000080, #1084d0); padding: 3px 6px; display: flex; align-items: center; justify-content: space-between; cursor: grab; }
    .mini-player-window .mini-titlebar .mini-title { font-weight: bold; color: #fff; font-size: 12px; }
    .mini-player-window .mini-titlebar .mini-btns { display: flex; gap: 2px; }
    .mini-player-window .mini-titlebar .mini-btns button { padding: 0; min-width: 16px; min-height: 14px; border: none; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; font-family: 'Microsoft Sans Serif', Arial; font-size: 10px; line-height: 14px; text-align: center; color: #000; cursor: pointer; }
    .mini-player-window .mini-body { padding: 10px 12px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; }
    .mini-player-window.minimized { width: 380px !important; height: auto !important; }
    .mini-player-window.minimized .mini-body { display: none !important; }
    .mini-player-window .mini-body .mini-cover { background: #000; padding: 3px; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; margin-bottom: 8px; text-align: center; height: 160px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; }
    .mini-player-window .mini-body .mini-cover .viz-side { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 1px; padding: 0 2px; min-width: 0; overflow: hidden; }
    .mini-player-window .mini-body .mini-cover .viz-bar { flex: 1 1 0; min-width: 2px; max-width: 4px; height: 0px; border-radius: 1px; transition: height 0.05s linear; background: linear-gradient(to top, #1e88e5, #64b5f6, #ffffff); box-shadow: 0 0 2px rgba(100, 181, 246, 0.6); opacity: 0; }
    .mini-player-window .mini-body .mini-cover .viz-bar.active { opacity: 1; }
    .mini-player-window .mini-body .mini-cover img { max-height: 100%; max-width: 60%; object-fit: contain; display: none; flex-shrink: 0; z-index: 2; position: relative; }
    .mini-player-window .mini-body .mini-cover img.show { display: block; margin: 0 auto; }
    .mini-player-window .mini-body .mini-cover .cover-placeholder { color: #888; font-size: 12px; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none; }
    .mini-player-window .mini-body .mini-info { display: flex; justify-content: space-between; padding: 2px 4px; background: #d8d8d8; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; font-size: 11px; color: #000; margin-bottom: 6px; }
    .mini-player-window .mini-body .mini-info .title { font-weight: bold; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-player-window .mini-body .mini-info .artist { color: #444; }
    .mini-player-window .mini-body .mini-info .duration { font-family: 'Consolas', monospace; color: #555; }
    .mini-player-window .mini-body .mini-progress { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .mini-player-window .mini-body .mini-progress input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 14px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; border: none; outline: none; padding: 0 2px; cursor: pointer; }
    .mini-player-window .mini-body .mini-progress input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; cursor: pointer; }
    .mini-player-window .mini-body .mini-progress .time-label { font-size: 10px; font-family: 'Consolas', monospace; background: #d8d8d8; padding: 0 6px; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; min-width: 50px; text-align: center; }
    .mini-player-window .mini-body .mini-controls { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 8px; }
    .mini-player-window .mini-body .mini-controls button { padding: 3px 12px; background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; font-family: 'Microsoft Sans Serif', Arial; font-size: 13px; color: #000; cursor: pointer; min-width: 40px; }
    .mini-player-window .mini-body .mini-controls .play-btn { min-width: 60px; font-size: 14px; font-weight: bold; }
    .mini-player-window .mini-body .mini-lyrics-wrap { display: flex; flex-direction: row; gap: 0; background: #d8d8d8; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; height: 110px; overflow: hidden; }
    .mini-player-window .mini-body .mini-lyrics { flex: 1; min-width: 0; padding: 4px 8px; overflow-y: auto; font-size: 11px; line-height: 1.5; color: #333; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
    .mini-player-window .mini-body .mini-lyrics::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .mini-player-window .mini-body .mini-lyrics .lyric-line { padding: 0 4px; transition: all 0.2s; cursor: pointer; white-space: pre-wrap; word-break: break-word; }
    .mini-player-window .mini-body .mini-lyrics .lyric-line.active { color: #000080; font-weight: bold; background: rgba(0,0,128,0.08); }
    .mini-player-window .mini-body .mini-lyrics-wrap .vscroll { width: 20px; padding: 2px 3px; align-self: stretch; }
    .mini-player-window.maximized { width: 100% !important; height: 100% !important; left: 0 !important; top: 0 !important; border-radius: 0 !important; }
    .mini-player-window.maximized .mini-body { display: block !important; }
    .mini-player-window.closed { display: none !important; }

    .movie-player-window { position: fixed; top: 60px; left: 60px; width: 720px; background: #c0c0c0; padding: 4px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf, 0 8px 32px rgba(0,0,0,0.6); z-index: 99999; display: none; min-width: 480px; user-select: none; overflow: hidden; flex-direction: column; }
    .movie-player-window .movie-titlebar { background: linear-gradient(90deg, #000080, #1084d0); padding: 3px 6px; display: flex; align-items: center; justify-content: space-between; cursor: grab; flex-shrink: 0; }
    .movie-player-window .movie-titlebar .movie-title-text { font-weight: bold; color: #fff; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 460px; }
    .movie-player-window .movie-titlebar .movie-btns { display: flex; gap: 2px; }
    .movie-player-window .movie-titlebar .movie-btns button { padding: 0; min-width: 18px; min-height: 16px; border: none; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; font-family: 'Microsoft Sans Serif', Arial; font-size: 11px; line-height: 16px; text-align: center; color: #000; cursor: pointer; }
    .movie-player-window .movie-body { padding: 6px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; display: flex; flex-direction: row; gap: 6px; flex: 1; min-height: 0; }

    .movie-player-window .movie-video-area .movie-placeholder { color: #666; font-size: 12px; text-align: center; padding: 20px; }
    .movie-player-window .movie-progress-bar { display: flex; align-items: center; gap: 6px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; padding: 6px 10px; flex-shrink: 0; }
    .movie-player-window .movie-progress-bar input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 14px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; border: none; outline: none; padding: 0 2px; cursor: pointer; min-width: 0; }
    .movie-player-window .movie-progress-bar input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; cursor: pointer; border: none; }
    .movie-player-window .movie-progress-bar .time-label { font-size: 11px; font-family: 'Consolas', monospace; background: #d8d8d8; padding: 2px 8px; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; min-width: 90px; text-align: center; flex-shrink: 0; color: #000; }
    .movie-player-window .movie-control-bar { display: flex; align-items: center; justify-content: center; gap: 20px; background: #c0c0c0; box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a; padding: 8px 10px; flex-shrink: 0; position: relative; }
    .movie-player-window .movie-control-bar button { padding: 4px 18px; background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; font-family: 'Microsoft Sans Serif', Arial; font-size: 14px; color: #000; cursor: pointer; font-weight: bold; min-width: 52px; height: 34px; display: flex; align-items: center; justify-content: center; }
    .movie-player-window .movie-control-bar button:disabled { opacity: 0.3; cursor: default; }
    .movie-player-window .movie-control-bar .bar-toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
    .movie-player-window .movie-right-col { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; width: 0; overflow: hidden; transition: width 0.2s ease; min-height: 0; position: relative; }
    .movie-player-window .movie-right-col.open { width: 220px; }
    .movie-player-window .episode-panel-wrap { flex: 1; display: flex; flex-direction: row; min-height: 0; min-width: 0; gap: 0; }

    .movie-player-window .episode-btn { padding: 6px 2px; background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; font-family: 'Microsoft Sans Serif', Arial; font-size: 12px; color: #000; cursor: pointer; text-align: center; font-weight: bold; }
    .movie-player-window .episode-btn:active { box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }

    .movie-player-window .movie-right-col .panel-toggle-btn { padding: 4px 12px; background: #c0c0c0; border: none; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; font-family: 'Microsoft Sans Serif', Arial; font-size: 14px; color: #000; cursor: pointer; font-weight: bold; min-width: 40px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: flex-start; }

    .movie-player-window video::-webkit-media-controls, .movie-player-window video::-webkit-media-controls-enclosure, .movie-player-window video::-webkit-media-controls-panel, .movie-player-window video::-webkit-media-controls-play-button, .movie-player-window video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none !important; }

    /* ============ 图书分区 ============ */

<script>
(function() {
    'use strict';

    const BASE_URL = 'https://loadly.io/';

    function getFullLoadlyUrl(code) {
        if (!code) return null;
        code = code.trim();
        if (code.startsWith('http://') || code.startsWith('https://')) return code;
        return BASE_URL + code;
    }

    window.extractDirectUrl = async function(shareUrl, fileType, maxRetries, externalSignal) {
        maxRetries = maxRetries || 2;
        var normalized = shareUrl.trim();
        if (!normalized.startsWith('http')) {
            if (normalized.startsWith('loadly.io/')) normalized = 'https://' + normalized;
            else normalized = 'https://loadly.io/' + normalized.replace(/^\/+/, '');
        }
        var extMap = { 'mp3':'mp3', 'txt':'txt', 'mp4':'mp4', 'zip':'zip', 'lrc':'lrc' };
        var targetExt = extMap[fileType] || 'mp3';
        for (var attempt = 0; attempt <= maxRetries; attempt++) {
            try {
                if (externalSignal && externalSignal.aborted) throw new Error('已中止');
                var response = await fetch(normalized, {
                    headers: { 'Accept': 'text/html,application/xhtml+xml' },
                    signal: externalSignal
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                var html = await response.text();
                if (externalSignal && externalSignal.aborted) throw new Error('已中止');
                var foundLinks = [];
                var downloadLinkRegex = /<a[^>]*href="([^"]*\/file\/download\/[^"]*)"[^>]*>/gi;
                var match;
                while ((match = downloadLinkRegex.exec(html)) !== null) {
                    var link = match[1];
                    if (link.startsWith('/')) link = 'https://loadly.io' + link;
                    if (foundLinks.indexOf(link) === -1) foundLinks.push(link);
                }
                var patterns = {
                    'mp3': [/https:\/\/app-storage\.loadly\.io\/[a-f0-9]+\.mp3[^"'\s]*/i, /https:\/\/[^\s"']+\.mp3/i],
                    'txt': [/https:\/\/app-storage\.loadly\.io\/[a-f0-9]+\.txt[^"'\s]*/i, /https:\/\/[^\s"']+\.txt/i],
                    'mp4': [/https:\/\/app-storage\.loadly\.io\/[a-f0-9]+\.mp4[^"'\s]*/i, /https:\/\/[^\s"']+\.mp4/i, /https:\/\/[^\s"']+\.m3u8/i],
                    'zip': [/https:\/\/app-storage\.loadly\.io\/[a-f0-9]+\.zip[^"'\s]*/i, /https:\/\/[^\s"']+\.zip/i, /https:\/\/[^\s"']+\.cbz/i],
                    'lrc': [/https:\/\/app-storage\.loadly\.io\/[a-f0-9]+\.lrc[^"'\s]*/i, /https:\/\/[^\s"']+\.lrc/i]
                };
                var filePatterns = patterns[fileType] || patterns['mp3'];
                for (var i = 0; i < filePatterns.length; i++) {
                    var pMatch = html.match(filePatterns[i]);
                    if (pMatch && foundLinks.indexOf(pMatch[0]) === -1) foundLinks.push(pMatch[0]);
                }
                var urlPattern = /(?:https?:)?\/\/[^\s"'<>]+\.(?:mp4|m3u8|ipa|apk|zip|mp3|txt|lrc)[^\s"'<>]*/gi;
                var urlMatch;
                while ((urlMatch = urlPattern.exec(html)) !== null) {
                    var url = urlMatch[0];
                    if (url.startsWith('//')) url = 'https:' + url;
                    if (foundLinks.indexOf(url) === -1) foundLinks.push(url);
                }
                var filtered = foundLinks.filter(function(link) {
                    return link.toLowerCase().includes('.' + targetExt.toLowerCase()) || link.includes('/file/download/');
                });
                if (filtered.length > 0) {
                    var extMatch = filtered.find(function(link) {
                        return link.toLowerCase().includes('.' + targetExt.toLowerCase());
                    });
                    return extMatch || filtered[0];
                }
                throw new Error('未找到直链');
            } catch (err) {
                if (externalSignal && externalSignal.aborted) throw new Error('已中止');
                if (attempt >= maxRetries) throw err;
                await new Promise(function(r) { setTimeout(r, 800 * (attempt + 1)); });
            }
        }
    };

    let pcApps = [], musicData = [], movieData = [], currentDisplaySongs = [];
    let txtBooks = [], comicBooks = [];
    let txtBooksLoaded = false, comicBooksLoaded = false;

    async function loadPcApps() {
        try {
            const response = await fetch('pcapp.js');
            if (!response.ok) throw new Error('无法加载 pcapp.js');
            const scriptText = await response.text();
            const fn = new Function('window', 'console', scriptText + '\nreturn PC_APPS_LIST;');
            const result = fn(window, console);
            if (result && Array.isArray(result) && result.length > 0) {
                pcApps = result.map(function(item) {
                    return {
                        id: item.i,
                        name: item.n,
                        code: item.c,
                        category: item.cat === 'a' ? 'apps' : (item.cat === 'g' ? 'games' : item.cat)
                    };
                });

    function extractCoverColors(imgElement, callback) {
        try {
            const cvs = document.createElement('canvas');
            const size = 32;
            cvs.width = size; cvs.height = size;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(imgElement, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;
            const buckets = {};
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const a = data[i+3];
                if (a < 128) continue;
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const sat = max === 0 ? 0 : (max - min) / max;
                if (sat < 0.15 || max < 40) continue;
                const hue = Math.round(Math.atan2(Math.sqrt(3) * (g - b), 2 * r - g - b) * 180 / Math.PI);
                const hb = Math.round(hue / 30) * 30;
                if (!buckets[hb]) buckets[hb] = { r: 0, g: 0, b: 0, n: 0 };
                buckets[hb].r += r; buckets[hb].g += g; buckets[hb].b += b; buckets[hb].n++;
            }
            const colors = Object.values(buckets).filter(b => b.n > 3).sort((a, b) => b.n - a.n).slice(0, 3).map(b => ({ r: Math.round(b.r / b.n), g: Math.round(b.g / b.n), b: Math.round(b.b / b.n) }));
            if (colors.length === 0) {
                colors.push({ r: 30, g: 136, b: 229 });
                colors.push({ r: 100, g: 181, b: 246 });
                colors.push({ r: 255, g: 255, b: 255 });
            } else if (colors.length === 1) {
                const c = colors[0];
                colors.push({ r: Math.min(255, c.r + 60), g: Math.min(255, c.g + 60), b: Math.min(255, c.b + 60) });
                colors.push({ r: 255, g: 255, b: 255 });
            } else if (colors.length === 2) {
                colors.push({ r: 255, g: 255, b: 255 });
            }
            callback(colors);
        } catch (e) {
            callback([{ r: 30, g: 136, b: 229 }, { r: 100, g: 181, b: 246 }, { r: 255, g: 255, b: 255 }]);
        }
    }

    function applyColorsToBars(colors) {
        const c1 = `rgb(${colors[0].r},${colors[0].g},${colors[0].b})`;
        const c2 = `rgb(${colors[1].r},${colors[1].g},${colors[1].b})`;
        const c3 = `rgb(${colors[2].r},${colors[2].g},${colors[2].b})`;
        const shadow = `rgba(${colors[1].r},${colors[1].g},${colors[1].b},0.6)`;
        vizBars.forEach(bar => {

        });

    function vizRender() {
        if (!analyser || !vizConnected || !vizVisible) { vizAnimId = null; return; }
        const freqData = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(freqData);
        const maxHeight = miniCover.clientHeight - 6;
        const totalBars = VIZ_BAR_COUNT;
        const binsPerBar = Math.floor(freqData.length / totalBars);
        const levelArr = [];
        for (let i = 0; i < totalBars; i++) {
            let sum = 0;
            for (let k = 0; k < binsPerBar; k++) sum += freqData[i * binsPerBar + k] || 0;
            levelArr.push(sum / binsPerBar / 255);
        }
        for (let j = 0; j < VIZ_BAR_COUNT; j++) {
            const levelIdx = (VIZ_BAR_COUNT - 1) - j;
            vizBars[j].style.height = Math.max(2, levelArr[levelIdx] * maxHeight) + 'px';
        }
        for (let k = 0; k < VIZ_BAR_COUNT; k++) {
            vizBars[VIZ_BAR_COUNT + k].style.height = Math.max(2, levelArr[k] * maxHeight) + 'px';
        }
        vizAnimId = requestAnimationFrame(vizRender);
    }

    function novelSaveProgress(bookId, percent) {
        try {
            var p = JSON.parse(localStorage.getItem('book_progress_scroll') || '{}');
            p[bookId] = percent;

    }
    function novelLoadProgress(bookId) {
        try { return JSON.parse(localStorage.getItem('book_progress_scroll') || '{}')[bookId] || 0; } catch(e) { return 0; }
    }
    function novelSaveFullContent(bookId, content) {
        try { localStorage.setItem('book_full_' + bookId, content); } catch(e) {}
    }

    async function novelGetTxtDirectUrl(shareUrl, retry) {
        retry = retry || 0;
        try {
            var directUrl = await window.extractDirectUrl(shareUrl, 'txt');
            if (directUrl) return directUrl;
            throw new Error('未找到TXT直链');
        } catch(e) {
            if (retry < 2) {
                await new Promise(function(r) { setTimeout(r, 800); });
                return novelGetTxtDirectUrl(shareUrl, retry + 1);
            }
            throw e;
        }
    }

    async function novelStreamAndCache(book) {
        novelCancelDownload = false;
        var direct = await novelGetTxtDirectUrl(book.url);
        var res = await fetch(direct);
        var reader = res.body.getReader ? res.body.getReader() : null;
        var decoder = new TextDecoder();
        var full = '';
        if (reader) {
            while (true) {
                if (novelCancelDownload) break;
                var result = await reader.read();
                if (result.done) break;
                full += decoder.decode(result.value, { stream: true });
            }
        } else {
            full = await res.text();
        }
        novelSaveFullContent(book.id, full);
        return full;
    }

    function updateNovelScrollBarState() {

    function updateNovelThumbPosition() {
        var maxScroll = novelTextArea.scrollHeight - novelTextArea.clientHeight;
        var scrollPercent = maxScroll > 0 ? novelTextArea.scrollTop / maxScroll : 0;
        var trackHeight = novelScrollTrack.clientHeight - novelScrollThumb.clientHeight;
        novelScrollThumb.style.top = Math.max(0, Math.min(scrollPercent * trackHeight, trackHeight)) + 'px';
    }
    novelTextArea.addEventListener('scroll', () => {

        if (novelSaveTimeout) clearTimeout(novelSaveTimeout);

                var max = novelTextArea.scrollHeight - novelTextArea.clientHeight;

    novelScrollTrack.addEventListener('mousedown', e => {
        if (e.target === novelScrollThumb || novelScrollBar.classList.contains('disabled')) return;
        const rect = novelScrollTrack.getBoundingClientRect();
        const thumbHeight = novelScrollThumb.clientHeight;
        const clickY = e.clientY - rect.top - thumbHeight / 2;
        const maxTop = novelScrollTrack.clientHeight - thumbHeight;
        const clampedY = Math.max(0, Math.min(clickY, maxTop));
        const percent = maxTop > 0 ? clampedY / maxTop : 0;
        const maxScroll = novelTextArea.scrollHeight - novelTextArea.clientHeight;
        novelTextArea.scrollTop = percent * maxScroll;
        updateNovelThumbPosition();
    });

        const trackHeight = novelScrollTrack.clientHeight;
        const maxTop = trackHeight - thumbHeight;
        let newTop = Math.max(0, Math.min(novelThumbStartTop + deltaY, maxTop));
        novelScrollThumb.style.top = newTop + 'px';
        const percent = maxTop > 0 ? newTop / maxTop : 0;
        const maxScroll = novelTextArea.scrollHeight - novelTextArea.clientHeight;
        novelTextArea.scrollTop = percent * maxScroll;
    });

    let comicState = {
        link: '', name: '', pages: [], currentPage: 0,

    const COMIC_DB_NAME = 'ComicCacheDB';
    const COMIC_STORE_NAME = 'comicData';
    const COMIC_DB_VERSION = 2;

    function openComicDB() {
        return new Promise(function(resolve, reject) {
            var request = indexedDB.open(COMIC_DB_NAME, COMIC_DB_VERSION);
            request.onupgradeneeded = function(event) {
                var db = event.target.result;
                if (!db.objectStoreNames.contains(COMIC_STORE_NAME)) {
                    db.createObjectStore(COMIC_STORE_NAME, { keyPath: 'id' });
                }
            };
            request.onsuccess = function() { resolve(request.result); };
            request.onerror = function() { reject(request.error); };
        });
    }
    function getComicCacheKey(link) {
        var full = link.trim();
        if (!full.startsWith('http')) full = 'https://loadly.io/' + full.replace(/^\/+/, '');
        return full.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    }
    async function hasCachedComic(link) {
        try {
            var db = await openComicDB();
            var key = getComicCacheKey(link);
            return new Promise(function(resolve) {
                var tx = db.transaction(COMIC_STORE_NAME, 'readonly');
                var store = tx.objectStore(COMIC_STORE_NAME);
                var getReq = store.get(key);
                getReq.onsuccess = function() { resolve(!!getReq.result); };
                getReq.onerror = function() { resolve(false); };
                tx.oncomplete = function() { db.close(); };
            });
        } catch(e) { return false; }
    }
    async function getCachedComic(link) {
        try {
            var db = await openComicDB();
            var key = getComicCacheKey(link);
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(COMIC_STORE_NAME, 'readonly');
                var store = tx.objectStore(COMIC_STORE_NAME);
                var getReq = store.get(key);
                getReq.onsuccess = function() { resolve(getReq.result || null); };
                getReq.onerror = function() { reject(getReq.error); };
                tx.oncomplete = function() { db.close(); };
            });
        } catch(e) { return null; }
    }
    async function saveCachedComic(link, name, images, total) {
        try {
            var db = await openComicDB();
            var key = getComicCacheKey(link);
            var imageEntries = [];
            for (var i = 0; i < images.length && i < total; i++) {
                var img = images[i];
                imageEntries.push({ name: img.name || 'page_' + (i+1), blob: img.blob || null, type: img.type || null });
            }
            var data = { id: key, name: name, total: total, images: imageEntries, timestamp: Date.now() };
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(COMIC_STORE_NAME, 'readwrite');
                var store = tx.objectStore(COMIC_STORE_NAME);
                var putReq = store.put(data);
                putReq.onsuccess = function() { resolve(); };
                putReq.onerror = function() { reject(putReq.error); };
                tx.oncomplete = function() { db.close(); };
            });
        } catch(e) {}
    }

    const COMIC_PROGRESS_KEY = 'comic_reader_progress_v5';
    function getComicProgress(link) {

    async function extractZipDirectUrl(shareUrl, retry) {
        retry = retry || 0;
        var normalized = shareUrl.trim();
        if (!normalized.startsWith('http')) {
            if (normalized.startsWith('loadly.io/')) normalized = 'https://' + normalized;
            else normalized = 'https://loadly.io/' + normalized.replace(/^\/+/, '');
        }
        try {
            var directUrl = await window.extractDirectUrl(normalized, 'zip');
            if (directUrl) return directUrl;
            throw new Error('未找到ZIP直链');
        } catch(err) {
            if (retry < 2) {
                await new Promise(function(r) { setTimeout(r, 800); });
                return extractZipDirectUrl(normalized, retry + 1);
            }
            throw err;
        }
    }

    async function openComicReader(comic) {
        comicWindow.style.display = 'flex';
        comicState.isClosed = false;
        comicState.isMinimized = false;
        comicState.isMaximized = false;
        updateComicWindowState();
        comicTitleText.textContent = comic.name;
        comicState.link = comic.url;
        comicState.name = comic.name;
        comicImageArea.innerHTML = '<div class="comic-placeholder">加载中...</div>';
        comicPageInfo.textContent = '0 / 0';
        comicPrevBtn.disabled = true;
        comicNextBtn.disabled = true;
        comicState.pages = [];
        comicState.currentPage = 0;

        try {
            var hasCache = await hasCachedComic(comic.url);
            if (hasCache) {
                var cached = await getCachedComic(comic.url);
                if (cached && cached.images && cached.images.length) {
                    comicState.pages = [];
                    for (var i = 0; i < cached.images.length; i++) {
                        var img = cached.images[i];
                        if (img && img.blob) {
                            comicState.pages.push({ url: URL.createObjectURL(img.blob), name: img.name });
                        } else {
                            comicState.pages.push({ url: null, name: img ? img.name : ('page_' + (i+1)) });
                        }
                    }
                    var savedIdx = getComicProgress(comic.url);
                    showComicPage(savedIdx >= 0 && savedIdx < comicState.pages.length ? savedIdx : 0);
                    return;
                }
            }

            var directUrl = await extractZipDirectUrl(comic.url);
            var response = await fetch(directUrl);
            if (!response.ok) throw new Error('下载失败: ' + response.status);
            var blob = await response.blob();
            var zip = await JSZip.loadAsync(blob);
            var allEntries = [];
            zip.forEach(function(path, file) {
                if (!file.dir) allEntries.push({ path: path, file: file });
            });
            var exts = ['.jpg','.jpeg','.png','.gif','.webp','.bmp','.jfif'];
            var images = allEntries.filter(function(e) {
                return exts.some(function(ext) { return e.path.toLowerCase().endsWith(ext); });
            });
            images.sort(function(a, b) { return a.path.localeCompare(b.path, undefined, { numeric: true }); });
            if (!images.length) throw new Error('未找到图片');

            comicState.pages = [];
            var cacheImages = [];
            for (var i = 0; i < images.length; i++) {
                var imgBlob = await images[i].file.async('blob');
                var url = URL.createObjectURL(imgBlob);
                comicState.pages.push({ url: url, name: images[i].path });
                cacheImages.push({ name: images[i].path, blob: imgBlob, type: imgBlob.type });
            }
            saveCachedComic(comic.url, comic.name, cacheImages, images.length);

            var savedIdx = getComicProgress(comic.url);
            showComicPage(savedIdx >= 0 && savedIdx < comicState.pages.length ? savedIdx : 0);

        } catch(e) {
            comicImageArea.innerHTML = '<div class="comic-placeholder">加载失败: ' + escapeHtml(e.message) + '</div>';
        }
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m] || m));
    }

    function parseMiniLRC(text) {
        if (!text) return [];
        const lines = text.split(/\r?\n/);
        const timeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)/;
        const parsed = [];
        for (const line of lines) {
            const match = line.match(timeRegex);
            if (!match) continue;
            const min = parseInt(match[1], 10);
            const sec = parseInt(match[2], 10);
            let ms = match[3] ? parseInt(match[3], 10) : 0;
            if (match[3] && match[3].length === 2) ms *= 10;
            const time = min * 60 + sec + ms / 1000;
            const txt = match[4].trim();
            if (!txt) continue;
            parsed.push({ time, text: txt });
        }
        parsed.sort((a, b) => a.time - b.time);
        return parsed;
    }

    async function extractCoverFromID3(arrayBuffer) {
        try {
            const data = new Uint8Array(arrayBuffer);
            if (data.length < 10 || String.fromCharCode(data[0], data[1], data[2]) !== 'ID3') return null;
            const size = ((data[6] & 0x7F) << 21) | ((data[7] & 0x7F) << 14) | ((data[8] & 0x7F) << 7) | (data[9] & 0x7F);
            let pos = 10;
            const end = Math.min(pos + size, data.length);
            while (pos + 10 <= end) {
                const frameId = String.fromCharCode(data[pos], data[pos+1], data[pos+2], data[pos+3]);
                const frameSize = (data[pos+4] << 24) | (data[pos+5] << 16) | (data[pos+6] << 8) | data[pos+7];
                if (frameSize === 0) break;
                const start = pos + 10;
                const frameEnd = Math.min(start + frameSize, data.length);
                if (frameId === 'APIC') {
                    let idx = start + 1;
                    while (idx < frameEnd && data[idx] !== 0) idx++;
                    idx++; idx++;
                    while (idx < frameEnd && data[idx] !== 0) idx++;
                    idx++;
                    const imageData = data.slice(idx, frameEnd);
                    if (imageData.length > 100) {
                        let mimeType = 'image/jpeg';
                        if (imageData[0] === 0x89 && imageData[1] === 0x50 && imageData[2] === 0x4E && imageData[3] === 0x47) mimeType = 'image/png';
                        else if (imageData[0] === 0x47 && imageData[1] === 0x49 && imageData[2] === 0x46) mimeType = 'image/gif';
                        return URL.createObjectURL(new Blob([imageData], { type: mimeType }));
                    }
                }
                pos += 10 + frameSize;
            }
            return null;
        } catch(e) { return null; }
    }

        return await response.arrayBuffer();

    async function loadMusicToMini(musicUrl, lyricUrl, title, artist) {
        if (!musicUrl) { miniTitle.textContent = '无效链接'; return; }
        if (isClosed) { isClosed = false; isMinimized = false; isMaximized = false; updateWindowState(); }
        if (currentMusicAbort) { try { currentMusicAbort.abort(); } catch(e){} }
        currentMusicAbort = new AbortController();

        miniTitle.textContent = title || '未知歌曲';
        miniArtist.textContent = artist || '未知歌手';
        miniDuration.textContent = '00:00 / 00:00';
        miniPlayBtn.textContent = '▶';
        coverPlaceholder.style.display = 'block';
        miniCoverImg.classList.remove('show');
        stopViz();
        currentLyricsLines = [];
        renderMiniLyrics([]);
        initVizBars();

        try {
            const [mp3Url, lrcUrl] = await Promise.all([
                window.extractDirectUrl(musicUrl, 'mp3', 2, currentMusicAbort.signal),
                lyricUrl ? window.extractDirectUrl(lyricUrl, 'lrc', 2, currentMusicAbort.signal) : Promise.resolve(null)
            ]);
            if (!mp3Url) throw new Error('未找到音乐直链');

            audio.removeEventListener('loadedmetadata', onLoadedMetadata);
            audio.removeEventListener('timeupdate', updateMiniTimeDisplay);
            audio.removeEventListener('ended', onEnded);
            audio.removeEventListener('error', onError);

            audio.crossOrigin = 'anonymous';
            audio.src = mp3Url;
            audio.load();

            try {
                const arrayBuffer = await fetchFirstBytes(mp3Url, 2097152);
                const coverUrl = await extractCoverFromID3(arrayBuffer);
                if (coverUrl) {
                    miniCoverImg.src = coverUrl;
                    miniCoverImg.classList.add('show');
                    coverPlaceholder.style.display = 'none';
                    miniCoverImg.onload = () => { extractCoverColors(miniCoverImg, applyColorsToBars); };
                    if (miniCoverImg.complete) extractCoverColors(miniCoverImg, applyColorsToBars);
                } else {
                    applyColorsToBars([{ r: 30, g: 136, b: 229 }, { r: 100, g: 181, b: 246 }, { r: 255, g: 255, b: 255 }]);
                }
            } catch(e) {
                applyColorsToBars([{ r: 30, g: 136, b: 229 }, { r: 100, g: 181, b: 246 }, { r: 255, g: 255, b: 255 }]);
            }

            if (lrcUrl) {
                try {
                    const lyricResp = await fetch(lrcUrl);
                    const lyricText = await lyricResp.text();
                    currentLyricsLines = parseMiniLRC(lyricText);
                    renderMiniLyrics(currentLyricsLines);
                } catch(e) { currentLyricsLines = []; renderMiniLyrics([]); }
            } else { currentLyricsLines = []; renderMiniLyrics([]); }

            audio.addEventListener('loadedmetadata', onLoadedMetadata);
            audio.addEventListener('timeupdate', updateMiniTimeDisplay);
            audio.addEventListener('ended', onEnded);
            audio.addEventListener('error', onError);

            audio.play().catch(() => { miniPlayBtn.textContent = '▶'; });
        } catch (error) {
            if (error.name === 'AbortError' || error.message === '已中止') return;
            console.error(error);
            miniTitle.textContent = '加载失败';
            miniPlayBtn.textContent = '▶';
        }
    }

        movieWindow.style.display = 'flex';
        updateMovieWindowState();
        if (mediaItem.type === 'movie') {
            movieTitleText.textContent = mediaItem.title;
            episodeToggleBtn.style.display = 'none';
            panelToggleBtn.style.display = 'none';
        } else {
            movieTitleText.textContent = mediaItem.title;
        }
        updateEpisodeButtons();
        renderEpisodePanel();
        await playEpisode(0);
    }

    function updateEpisodeButtons() {
        if (!currentMovieMedia || currentMovieMedia.type !== 'tv') {
            moviePrevBtn.disabled = true; movieNextBtn.disabled = true; return;
        }
        moviePrevBtn.disabled = (currentEpisodeIndex <= 0);
        movieNextBtn.disabled = (currentEpisodeIndex >= currentMovieMedia.episodes.length - 1);
    }

    function renderEpisodePanel() {
        episodeGrid.innerHTML = '';
        if (!currentMovieMedia || currentMovieMedia.type !== 'tv') return;
        currentMovieMedia.episodes.forEach((ep, idx) => {
            const btn = document.createElement('button');
            btn.className = 'episode-btn';
            if (idx === currentEpisodeIndex) btn.classList.add('active');
            btn.textContent = (idx + 1);
            btn.title = '第 ' + (idx + 1) + ' 集';
            btn.addEventListener('click', async () => {
                currentEpisodeIndex = idx;
                renderEpisodePanel();
                updateEpisodeButtons();
                await playEpisode(idx);
            });
            episodeGrid.appendChild(btn);
        });
        setTimeout(updateEpisodeScrollBarState, 50);
    }

    async function playEpisode(index) {
        if (!currentMovieMedia) return;
        const episode = currentMovieMedia.episodes[index];
        if (!episode) return;
        currentEpisodeIndex = index;
        updateEpisodeButtons();
        renderEpisodePanel();
        if (currentMovieAbort) { try { currentMovieAbort.abort(); } catch(e){} }
        currentMovieAbort = new AbortController();
        const loadId = ++currentMovieLoadId;
        try {
            const shareUrl = getFullLoadlyUrl(episode.url);
            const direct = await window.extractDirectUrl(shareUrl, 'mp4', 2, currentMovieAbort.signal);
            if (loadId !== currentMovieLoadId) return;
            if (!direct) throw new Error('未找到视频直链');
            movieVideo.pause();
            movieVideo.removeAttribute('src');
            movieVideo.load();
            movieVideo.src = direct;
            movieVideo.load();
            movieVideo.style.display = 'block';
            moviePlaceholder.style.display = 'none';
            if (currentMovieMedia.type === 'movie') {
                movieTitleText.textContent = currentMovieMedia.title;
            } else {
                movieTitleText.textContent = currentMovieMedia.title + ' · 第 ' + (index + 1) + ' 集';
            }
            movieVideo.onloadedmetadata = () => {
                if (loadId !== currentMovieLoadId) return;
                movieVideo.play().catch(() => {});
                moviePlayBtn.textContent = '⏸';
                updateMovieProgressDisplay();
            };
            movieVideo.onended = () => {
                if (loadId !== currentMovieLoadId) return;
                moviePlayBtn.textContent = '▶';
                if (currentMovieMedia.type === 'tv' && index < currentMovieMedia.episodes.length - 1) {
                    currentEpisodeIndex = index + 1;
                    playEpisode(currentEpisodeIndex);
                }
            };
            movieVideo.play().catch(() => {});
        } catch (error) {
            if (error.name === 'AbortError' || error.message === '已中止') return;
            if (loadId !== currentMovieLoadId) return;
            console.error(error);
            moviePlaceholder.textContent = '加载失败: ' + error.message;
            moviePlaceholder.style.display = 'block';
            movieVideo.style.display = 'none';
        }
    }

    moviePlayBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!movieVideo.src) return;
        if (movieVideo.paused) { movieVideo.play().catch(() => {}); moviePlayBtn.textContent = '⏸'; }
        else { movieVideo.pause(); moviePlayBtn.textContent = '▶'; }
    });
    moviePrevBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!currentMovieMedia || currentMovieMedia.type !== 'tv') return;
        if (currentEpisodeIndex > 0) playEpisode(currentEpisodeIndex - 1);
    });
    movieNextBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!currentMovieMedia || currentMovieMedia.type !== 'tv') return;
        if (currentEpisodeIndex < currentMovieMedia.episodes.length - 1) playEpisode(currentEpisodeIndex + 1);
    });

    function updateMovieProgressDisplay() {
        const current = movieVideo.currentTime || 0;
        const duration = movieVideo.duration || 0;
        if (duration > 0 && isFinite(duration)) movieProgress.value = (current / duration) * 1000;
        else movieProgress.value = 0;
        movieTimeLabel.textContent = formatTime(current) + ' / ' + formatTime(duration);
    }
    movieVideo.addEventListener('timeupdate', () => { if (!movieProgress.dataset.seeking) updateMovieProgressDisplay(); });
    movieVideo.addEventListener('loadedmetadata', updateMovieProgressDisplay);
    movieProgress.addEventListener('input', function() {
        this.dataset.seeking = '1';
        const dur = movieVideo.duration;
        if (!dur || isNaN(dur) || dur <= 0) return;
        const percent = parseFloat(this.value) / 1000;
        movieTimeLabel.textContent = formatTime(percent * dur) + ' / ' + formatTime(dur);
    });
    movieProgress.addEventListener('change', function() {
        delete this.dataset.seeking;
        const dur = movieVideo.duration;
        if (!dur || isNaN(dur) || dur <= 0) return;
        movieVideo.currentTime = (parseFloat(this.value) / 1000) * dur;
        updateMovieProgressDisplay();
    });

    // ============================================================
    // 小狗指令解析
    // ============================================================
    const dogRover = document.getElementById('dogRover');
    const dogSendBox = document.getElementById('dogSendBox');
    const dogInput = document.getElementById('dogInput');
    const dogSendBtn = document.getElementById('dogSendBtn');
    const dogBubbleText = document.getElementById('dogBubbleText');

    let pendingCandidates = null;
    let pendingEpisodes = null;
    let waitingEpisode = null;

    function cnNumToInt(s) {
        const map = { '零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
        if (/^\d+$/.test(s)) return parseInt(s, 10);
        if (s === '十') return 10;
        if (s.length === 1) return map[s] !== undefined ? map[s] : null;
        if (s.startsWith('十')) { const rest = s.slice(1); return 10 + (map[rest] || 0); }
        if (s.includes('十')) { const [a, b] = s.split('十'); return (map[a] || 1) * 10 + (b ? (map[b] || 0) : 0); }
        return null;
    }

    function findBestMatch(text, name) {
        if (!name || name.length < 2) return 0;
        const textLower = text.toLowerCase();
        const nameLower = name.toLowerCase();
        let best = 0;
        for (let len = nameLower.length; len >= 2; len--) {
            for (let start = 0; start + len <= nameLower.length; start++) {
                const sub = nameLower.slice(start, start + len);
                if (textLower.includes(sub)) { if (len > best) best = len; }
            }
        }
        return best;
    }

    function matchByArtist(text, item) {
        if (!item.artist) return 0;
        return findBestMatch(text, item.artist);
    }

    function setBubbleText(text) {
        dogBubbleText.textContent = text;
        dogBubbleText.style.lineHeight = '1.2';
        let size = 9;
        const minSize = 1;
        while (size >= minSize) {
            dogBubbleText.style.fontSize = size + 'px';
            void dogBubbleText.offsetHeight;
            if (dogBubbleText.scrollHeight <= dogBubbleText.clientHeight &&
                dogBubbleText.scrollWidth <= dogBubbleText.clientWidth) {
                return;
            }
            size -= 1;
        }
        dogBubbleText.style.fontSize = '1px';
        void dogBubbleText.offsetHeight;
        let lines = text.split('\n');
        while (lines.length > 1 && (
            dogBubbleText.scrollHeight > dogBubbleText.clientHeight ||
            dogBubbleText.scrollWidth > dogBubbleText.clientWidth
        )) {
            lines.pop();
            dogBubbleText.textContent = lines.join('\n') + '\n…';
            void dogBubbleText.offsetHeight;
        }
    }

    function handleCommand(rawText) {
        const text = rawText.trim();
        if (!text) return;

        if (waitingEpisode) {
            const m = text.match(/([0-9]+|[零一二两三四五六七八九十]+)/);
            if (m) {
                const ep = cnNumToInt(m[1]);
                if (ep !== null && ep >= 1 && ep <= waitingEpisode.media.episodes.length) {
                    const media = waitingEpisode.media;
                    waitingEpisode = null;
                    setBubbleText('还有需要办的事情吗？');
                    openMoviePlayer(media);
                    setTimeout(function() { playEpisode(ep - 1); }, 100);
                } else {
                    setBubbleText('这部剧只有 ' + waitingEpisode.media.episodes.length + ' 集哦，请回复 1-' + waitingEpisode.media.episodes.length);
                }
            }
            return;
        }

        if (pendingCandidates) {
            const numMatch = text.match(/^\s*([0-9]+|[零一二两三四五六七八九十]+)\s*$/);
            if (numMatch) {
                const idx = cnNumToInt(numMatch[1]) - 1;
                if (idx >= 0 && idx < pendingCandidates.length) {
                    const chosen = pendingCandidates[idx];
                    const ep = pendingEpisodes;
                    pendingCandidates = null; pendingEpisodes = null;
                    setBubbleText('');
                    executeChoice(chosen.action, chosen.item, ep);
                } else {
                    setBubbleText('没有第 ' + numMatch[1] + ' 个哦，请回复 1 到 ' + pendingCandidates.length);
                }
                return;
            }
            pendingCandidates = null;
            pendingEpisodes = null;
        }

        let search = text.replace(/第\s*([0-9]+|[零一二两三四五六七八九十]+)[集话期]?/, '').trim();
        let episode = null;
        const epMatch = text.match(/第\s*([0-9]+|[零一二两三四五六七八九十]+)/);
        if (epMatch) episode = cnNumToInt(epMatch[1]);
        search = search.replace(/[，。！？、,.!?\s]+/g, ' ').trim();

        if (!search) {
            setBubbleText('你要什么呀？直接输入名字试试');
            return;
        }

        const allSources = [
            { type: 'music', data: musicData || [], label: '歌曲' },
            { type: 'movie', data: movieData || [], label: '电影/剧集' },
            { type: 'app', data: pcApps || [], label: '应用' },
            { type: 'novel', data: txtBooks || [], label: '小说' },
            { type: 'comic', data: comicBooks || [], label: '漫画' }
        ];

        const matched = [];
        allSources.forEach(function(src) {
            src.data.forEach(function(item) {
                const name = item.title || item.name || '';
                const nameScore = findBestMatch(search, name);
                const artistScore = src.type === 'music' ? matchByArtist(search, item) : 0;
                const score = Math.max(nameScore, artistScore);
                if (score >= 2) {
                    matched.push({ item: item, score: score, action: src.type, label: src.label });
                }
            });
        });

        if (matched.length === 0) {
            setBubbleText('小狗没找到"' + search + '"，你再想想名字？');
            return;
        }

        matched.sort(function(a, b) { return b.score - a.score; });
        const topScore = matched[0].score;
        const topItems = matched.filter(function(m) { return m.score === topScore; });

        if (topItems.length === 1) {
            const m = topItems[0];
            executeChoice(m.action, m.item, episode);
        } else {
            pendingCandidates = topItems.map(function(m) { return { item: m.item, action: m.action, label: m.label }; });
            pendingEpisodes = episode;
            showMixedCandidates(topItems);
        }
    }

    function showMixedCandidates(items) {
        let lines = ['找到多个，你要哪个？'];
        items.forEach(function(m, i) {
            const name = m.item.title || m.item.name || '';
            const artist = m.item.artist ? ' - ' + m.item.artist : '';
            lines.push((i + 1) + '. [' + m.label + '] ' + name + artist);
        });
        setBubbleText(lines.join('\n'));
    }

    function executeChoice(action, item, episode) {
        if (action === 'music') {
            const mp3 = getFullLoadlyUrl(item.mp3);
            const lyric = item.lyric ? getFullLoadlyUrl(item.lyric) : '';
            setBubbleText('还有需要办的事情吗？');
            miniWindow.style.display = 'block';
            loadMusicToMini(mp3, lyric, item.title, item.artist || '未知歌手');
        } else if (action === 'movie') {
            const media = item;
            if (media.type === 'tv') {
                let ep = episode;
                if (ep === null) {
                    setBubbleText('要看《' + media.title + '》第几集？');
                    waitingEpisode = { media: media, index: 0 };
                    return;
                }
                if (ep < 1 || ep > media.episodes.length) {
                    setBubbleText('《' + media.title + '》只有 ' + media.episodes.length + ' 集哦，请回复 1-' + media.episodes.length);
                    waitingEpisode = { media: media, index: 0 };
                    return;
                }
                setBubbleText('还有需要办的事情吗？');
                openMoviePlayer(media);
                setTimeout(function() { playEpisode(ep - 1); }, 100);
            } else {
                setBubbleText('还有需要办的事情吗？');
                openMoviePlayer(media);
            }
        } else if (action === 'app') {
            const shareUrl = getFullLoadlyUrl(item.code);
            setBubbleText('还有需要办的事情吗？');
            handleDownload(shareUrl);
        } else if (action === 'novel') {
            setBubbleText('还有需要办的事情吗？');
            openNovelReader(item);
        } else if (action === 'comic') {
            setBubbleText('还有需要办的事情吗？');
            openComicReader(item);
        }
    }

    dogRover.addEventListener('click', function() {
        dogSendBox.classList.toggle('show');
        if (dogSendBox.classList.contains('show')) setTimeout(function() { dogInput.focus(); }, 50);
    });

    function dogSend() {
        const text = dogInput.value.trim();
        if (!text) return;
        dogInput.value = '';
        handleCommand(text);
    }
    dogSendBtn.addEventListener('click', dogSend);
    dogInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') dogSend(); });

    // ============================================================
    // 初始化
    // ============================================================
    Promise.all([loadPcApps(), loadMusicData(), loadMovieData(), loadTxtBooks(), loadComicBooks()]).then(() => {
        currentCategory = 'apps';
        menuLabel.textContent = '应用';
        dropdownItems.forEach(el => {
            el.classList.remove('active');
            if (el.dataset.category === 'apps') el.classList.add('active');
        });
        renderAppList();
        updateWindowState();
        updateMovieWindowState();
        updateNovelWindowState();
        updateComicWindowState();
        console.log('APP Store 已完全启动');
    });

})();
</script>
